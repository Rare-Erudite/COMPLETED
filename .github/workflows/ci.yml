name: CI

# Real gates only. Every step here either passes on its own merits or fails the
# build. Nothing is allowed to report success on a non-zero exit code, and no
# test is weakened to make the runner happy.

on:
  push:
    branches: [main, New-Fixes-by-Erudite]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install ffmpeg and ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      # @huggingface/transformers pulls onnxruntime-node, whose postinstall
      # downloads native binaries from a Microsoft CDN. That download has been
      # observed to time out (ETIMEDOUT / ENETUNREACH) and fail the whole job in
      # ~40s on an otherwise healthy commit. It is a transient network fault, not
      # a code fault, so retry with backoff instead of failing the release.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            echo "::group::npm ci attempt $attempt"
            if npm ci --no-audit --no-fund; then
              echo "::endgroup::"
              echo "Dependencies installed on attempt $attempt."
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::npm ci failed on attempt $attempt (transient registry/CDN fault). Retrying in $((attempt * 20))s."
              sleep $((attempt * 20))
            fi
          done
          echo "::error::npm ci failed after 3 attempts. This is a real dependency failure, not a flake."
          exit 1

      - name: Typecheck
        run: npm run lint

      - name: Build web and server bundles
        run: npm run build

      - name: Run the full test suite
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          RARE_SKIP_DEV_BUNDLER: 'true'
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile browser checks
        run: npm run test:e2e

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            server-build/
          retention-days: 7
          if-no-files-found: warn

  windows:
    name: Windows typecheck, build and browser verification
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm ci --no-audit --no-fund
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw 'npm ci failed after three attempts.' }
            Start-Sleep -Seconds (20 * $attempt)
          }

      - name: Typecheck
        run: npm run lint

      - name: Build web and server bundles
        run: npm run build

      - name: Run the full test suite
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          RARE_SKIP_DEV_BUNDLER: 'true'
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run desktop and mobile browser checks
        run: npm run test:e2e

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verify, windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the Android SDK. `setup-android@v3`
      # failed here with "Failed to find package 'tools'" because the modern
      # cmdline-tools no longer publish a package by that name, so we use the
      # preinstalled SDK and only install the platform/build-tools we need.
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "Using SDK at $SDK"
          ls "$SDK" || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          # build_apk.sh calls aapt/aapt2/d8/zipalign by bare name, so the
          # build-tools directory has to be on PATH.
          echo "$SDK/build-tools/34.0.0" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_COMPILE_SDK=34" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS=$SDK/build-tools/34.0.0" >> "$GITHUB_ENV"
          RUN_DATE="$(date -u +%y%m%d)"
          echo "RARE_APP_VERSION_CODE=$((10#$RUN_DATE * 1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "Android SDK ready."

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            echo "::group::npm ci attempt $attempt"
            if npm ci --no-audit --no-fund; then
              echo "::endgroup::"
              echo "Dependencies installed on attempt $attempt."
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::npm ci failed on attempt $attempt (transient registry/CDN fault). Retrying in $((attempt * 20))s."
              sleep $((attempt * 20))
            fi
          done
          echo "::error::npm ci failed after 3 attempts. This is a real dependency failure, not a flake."
          exit 1

      - name: Restore signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured. A release APK cannot be produced without the permanent signing key, and an APK signed by a new key can never update an installed RARE app."
            echo "have_keystore=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
          test -s "$RUNNER_TEMP/keystore/release.keystore" || { echo "::error::The decoded keystore is empty."; exit 1; }
          echo "have_keystore=true" >> "$GITHUB_OUTPUT"

      - name: Build and sign the release APK
        id: apk
        env:
          RARE_APP_VERSION_NAME: 1.1.2
          RARE_BACKEND_URL: https://rareproject.vercel.app
          RARE_ANDROID_KEYSTORE: ${{ runner.temp }}/keystore/release.keystore
          RARE_ANDROID_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RARE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RARE_ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # build_apk.sh refuses to mint a throwaway signing key, because an APK
          # signed by a new key can never update an installed one. There is no
          # correct APK to produce without the secret, so this fails rather than
          # reporting a green run with no artifact.
          bash scripts/build_apk.sh
          cp "exports/rare-v${RARE_APP_VERSION_NAME}-release.apk" "$RUNNER_TEMP/rare-candidate.apk"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Install candidate and verify same-key update on Android 13
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RARE_APP_VERSION_NAME: 1.1.2
          RARE_ANDROID_KEYSTORE: ${{ runner.temp }}/keystore/release.keystore
          RARE_ANDROID_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RARE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RARE_ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: Pixel_6
          script: |
            set -euo pipefail
            candidate="$RUNNER_TEMP/rare-candidate.apk"
            final="exports/rare-v${RARE_APP_VERSION_NAME}-release.apk"
            adb install "$candidate"
            adb shell dumpsys package com.rare.ai.intelligence | grep -q 'versionCode='
            original_code="$RARE_APP_VERSION_CODE"
            candidate_code="$(adb shell dumpsys package com.rare.ai.intelligence | sed -n 's/.*versionCode=\([0-9]*\).*/\1/p' | head -1 | tr -d '\r')"
            test "$candidate_code" = "$original_code"
            adb shell am start -W -n com.rare.ai.intelligence/.MainActivity
            sleep 5
            adb shell pidof com.rare.ai.intelligence
            RARE_APP_VERSION_CODE="$((original_code + 1))" bash scripts/build_apk.sh
            adb install -r "$final"
            adb shell am force-stop com.rare.ai.intelligence
            adb shell am start -W -n com.rare.ai.intelligence/.MainActivity
            sleep 5
            adb shell pidof com.rare.ai.intelligence
            final_code="$(adb shell dumpsys package com.rare.ai.intelligence | sed -n 's/.*versionCode=\([0-9]*\).*/\1/p' | head -1 | tr -d '\r')"
            test "$final_code" = "$((original_code + 1))"
            echo "Android 13 installed candidate $candidate_code and updated it with the same signing key to $final_code."

      - name: Verify the APK signature and metadata
        run: |
          APK="exports/rare-v${RARE_APP_VERSION_NAME:-1.1.2}-release.apk"
          test -f "$APK" || { echo "::error::APK was not produced at $APK"; exit 1; }
          ls -l "$APK"
          sha256sum "$APK"
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "--- signature ---"
          SIGNATURE_INFO="$("$SDK/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$SIGNATURE_INFO"
          printf '%s\n' "$SIGNATURE_INFO" | grep -qi '9285a1e7803ed7809168e951ad09d2c851f3ac21af04044896b6827205752f92'
          echo "--- package metadata ---"
          BADGING="$("$SDK/build-tools/34.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -E "^package:|^application-label:|sdkVersion|targetSdkVersion"
          printf '%s\n' "$BADGING" | grep -q "package: name='com.rare.ai.intelligence'"
          printf '%s\n' "$BADGING" | grep -q "versionName='1.1.2'"
          printf '%s\n' "$BADGING" | grep -q "versionCode='$((RARE_APP_VERSION_CODE + 1))'"
          unzip -p "$APK" assets/www/index.html | grep -Fq "https://rareproject.vercel.app"
          # A release APK must not permit cleartext traffic.
          if "$SDK/build-tools/34.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q "usesCleartextTraffic.*0xffffffff"; then
            echo "::error::The release APK permits cleartext HTTP traffic."
            exit 1
          fi
          echo "Cleartext traffic is disabled."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rare-apk
          path: exports/rare-v*-release.apk
          retention-days: 14
          if-no-files-found: error
