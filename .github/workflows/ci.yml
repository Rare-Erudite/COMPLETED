name: CI

# Real gates only. Every step here either passes on its own merits or fails the
# build. Nothing is allowed to report success on a non-zero exit code, and no
# test is weakened to make the runner happy.

on:
  push:
    branches: [main, New-Fixes-by-Erudite]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install ffmpeg and ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Build web and server bundles
        run: npm run build

      - name: Run the full test suite
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          RARE_SKIP_DEV_BUNDLER: 'true'
        run: npm test

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            server-build/
          retention-days: 7
          if-no-files-found: warn

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not configured; the APK will be built unsigned and will not be installable as an update."
            echo "have_keystore=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
          echo "have_keystore=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          RARE_BACKEND_URL: https://rareproject.vercel.app
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/keystore/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/build_apk.sh

      - name: Verify the APK exists and report its hash
        run: |
          APK=exports/rare-v1.0.0-release.apk
          test -f "$APK" || { echo "::error::APK was not produced at $APK"; exit 1; }
          ls -l "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rare-apk
          path: exports/rare-v1.0.0-release.apk
          retention-days: 14
          if-no-files-found: error
