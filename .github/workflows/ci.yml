name: CI

# Real gates only. Every step here either passes on its own merits or fails the
# build. Nothing is allowed to report success on a non-zero exit code, and no
# test is weakened to make the runner happy.

on:
  push:
    branches: [main, New-Fixes-by-Erudite]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install ffmpeg and ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      # @huggingface/transformers pulls onnxruntime-node, whose postinstall
      # downloads native binaries from a Microsoft CDN. That download has been
      # observed to time out (ETIMEDOUT / ENETUNREACH) and fail the whole job in
      # ~40s on an otherwise healthy commit. It is a transient network fault, not
      # a code fault, so retry with backoff instead of failing the release.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            echo "::group::npm ci attempt $attempt"
            if npm ci --no-audit --no-fund; then
              echo "::endgroup::"
              echo "Dependencies installed on attempt $attempt."
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::npm ci failed on attempt $attempt (transient registry/CDN fault). Retrying in $((attempt * 20))s."
              sleep $((attempt * 20))
            fi
          done
          echo "::error::npm ci failed after 3 attempts. This is a real dependency failure, not a flake."
          exit 1

      - name: Typecheck
        run: npm run lint

      - name: Build web and server bundles
        run: npm run build

      - name: Run the full test suite
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          RARE_SKIP_DEV_BUNDLER: 'true'
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile browser checks
        run: npm run test:e2e

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            server-build/
          retention-days: 7
          if-no-files-found: warn

  windows:
    name: Windows typecheck, build and browser verification
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm ci --no-audit --no-fund
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw 'npm ci failed after three attempts.' }
            Start-Sleep -Seconds (20 * $attempt)
          }

      - name: Typecheck
        run: npm run lint

      - name: Build web and server bundles
        run: npm run build

      - name: Run the full test suite
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          RARE_SKIP_DEV_BUNDLER: 'true'
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run desktop and mobile browser checks
        run: npm run test:e2e
