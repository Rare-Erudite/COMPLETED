name: Final Android release verification

on:
  push:
    tags:
      - 'rare-final-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Frozen source tag (rare-final-vX.Y.Z)
        required: true
        type: string
permissions:
  contents: write
  actions: read
  deployments: read

concurrency:
  group: rare-final-android-release
  cancel-in-progress: false

jobs:
  verify-and-package:
    name: Gate, build once, and verify update compatibility
    runs-on: ubuntu-latest
    environment: rare-final-release
    timeout-minutes: 150
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Check out the frozen source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Require frozen tag, completed gates, and successful source CI
        id: release-gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^rare-final-v[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "::error::Select a rare-final-v* semantic version tag."; exit 1; }
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          RELEASE_SHA="$(git rev-parse "$RELEASE_TAG^{commit}")"
          VERSION_NAME="${RELEASE_TAG#rare-final-v}"
          [[ "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "::error::The tag must end in a numeric semantic version."; exit 1; }
          git checkout --detach "$RELEASE_SHA"
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || { echo "::error::Checkout does not match the requested release SHA."; exit 1; }
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$main_sha" == "$RELEASE_SHA" ]] || { echo "::error::Release source must be the current production main commit."; exit 1; }
          deployments="$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$RELEASE_SHA&environment=Production&per_page=100")"
          deployment_id="$(jq -r 'sort_by(.created_at) | last | .id // empty' <<<"$deployments")"
          [[ -n "$deployment_id" ]] || { echo "::error::No Production deployment is recorded for the release commit."; exit 1; }
          deployment_state="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses?per_page=1" --jq '.[0].state // empty')"
          [[ "$deployment_state" == success ]] || { echo "::error::The release commit has no successful Production deployment."; exit 1; }
          health="$(curl --fail --silent --show-error --retry 3 --max-time 20 https://rareproject.vercel.app/api/health)"
          jq -e --arg sha "$RELEASE_SHA" '.ok == true and .commit_sha == $sha' <<<"$health" >/dev/null || { echo "::error::Production health does not attest the exact release commit."; exit 1; }
          service_status="$(curl --fail --silent --show-error --retry 3 --max-time 20 https://rareproject.vercel.app/api/status)"
          jq -e '.services.storage.databaseConfigured == true and .services.storage.databaseReachable == true and .services.storage.schemaReady == true' <<<"$service_status" >/dev/null || { echo "::error::Production persistent storage is not healthy."; exit 1; }
          grep -Fq '**Release gate: PASSED**' docs/completion/RELEASE_READINESS.md || { echo "::error::Release readiness has not been signed off."; exit 1; }
          grep -Fq '**Security gate: PASSED**' docs/completion/SECURITY_REVIEW.md || { echo "::error::Security review is incomplete."; exit 1; }
          if grep -Eq '^[[:space:]]*-[[:space:]]*\[[[:space:]]\]' docs/completion/MASTER_COMPLETION_CHECKLIST.md; then
            echo "::error::The completion checklist still has unchecked items."; exit 1
          fi
          if grep -Eiq '\|[[:space:]]*(PARTIAL|NOT VERIFIED|PENDING|BLOCKED)' docs/completion/FEATURE_VERIFICATION_MATRIX.md; then
            echo "::error::The feature matrix still contains incomplete or blocked areas."; exit 1
          fi
          ci="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$RELEASE_SHA" --limit 1 --json status,conclusion)"
          echo "$ci" | jq -e 'length == 1 and .[0].status == "completed" and .[0].conclusion == "success"' >/dev/null || { echo "::error::Source CI has not passed on the exact frozen SHA."; exit 1; }
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Source freeze and release gates verified for $RELEASE_SHA."

      - name: Set up Java and Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "$SDK/build-tools/34.0.0" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_COMPILE_SDK=34" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS=$SDK/build-tools/34.0.0" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore and verify the published release signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "::error::Required signing secret is unavailable: $name"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/rare-keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rare-keystore/release.keystore"
          export STORE_PASS="$KEYSTORE_PASSWORD"
          fingerprint="$(keytool -exportcert -keystore "$RUNNER_TEMP/rare-keystore/release.keystore" -alias "$KEY_ALIAS" -storepass:env STORE_PASS | openssl dgst -sha256 -binary | od -An -vtx1 | tr -d ' \n' | tr '[:lower:]' '[:upper:]')"
          [[ "$fingerprint" == '37BE10E99449FBC5F90331965905E8D2CCD31A446301EAFA20620F11BADEE1DF' ]] || { echo "::error::Configured signing key does not match the verified replacement RARE release certificate."; exit 1; }
          export KEY_PASS="$KEY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/signing-check"
          printf 'Manifest-Version: 1.0\n\n' > "$RUNNER_TEMP/signing-check/MANIFEST.MF"
          printf 'signing credential verification\n' > "$RUNNER_TEMP/signing-check/payload.txt"
          jar --create --file "$RUNNER_TEMP/signing-check/probe.jar" --manifest "$RUNNER_TEMP/signing-check/MANIFEST.MF" -C "$RUNNER_TEMP/signing-check" payload.txt
          jarsigner -keystore "$RUNNER_TEMP/rare-keystore/release.keystore" -storetype PKCS12 -storepass:env STORE_PASS -keypass:env KEY_PASS "$RUNNER_TEMP/signing-check/probe.jar" "$KEY_ALIAS" >/dev/null 2>&1
          jarsigner -verify "$RUNNER_TEMP/signing-check/probe.jar" >/dev/null 2>&1
          rm -rf "$RUNNER_TEMP/signing-check"
          echo "Replacement Android release identity verified."

      - name: Build the one final APK from the frozen source
        env:
          RARE_APP_VERSION_NAME: ${{ steps.release-gate.outputs.version_name }}
          RARE_BACKEND_URL: https://rareproject.vercel.app
          RARE_ANDROID_KEYSTORE: ${{ runner.temp }}/rare-keystore/release.keystore
          RARE_ANDROID_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RARE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RARE_ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          run_date="$(date -u +%y%m%d)"
          export RARE_APP_VERSION_CODE=$((10#$run_date * 1000 + GITHUB_RUN_NUMBER))
          echo "RARE_APP_VERSION_CODE=$RARE_APP_VERSION_CODE" >> "$GITHUB_ENV"
          bash scripts/build_apk.sh
          apk="exports/rare-v${RARE_APP_VERSION_NAME}-release.apk"
          test -s "$apk"
          apksigner verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/final-signature.txt"
          grep -qi '37be10e99449fbc5f90331965905e8d2ccd31a446301eafa20620f11badee1df' "$RUNNER_TEMP/final-signature.txt"
          aapt dump badging "$apk" | grep -q "package: name='com.rare.ai.intelligence'"
          aapt dump badging "$apk" | grep -q "versionName='${RARE_APP_VERSION_NAME}'"
          unzip -p "$apk" assets/www/index.html | grep -Fq 'https://rareproject.vercel.app'
          sha256sum "$apk"
          stat --format='APK size: %s bytes' "$apk"

      - name: Clean-install and smoke test on minimum API 21
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 21
          target: default
          arch: x86
          profile: Nexus 5
          script: |
            set -euo pipefail
            apk="exports/rare-v${RELEASE_TAG#rare-final-v}-release.apk"
            adb install "$apk"
            adb shell am start -W -n com.rare.ai.intelligence/.MainActivity
            sleep 5
            adb shell pidof com.rare.ai.intelligence

      - name: Clean-install and smoke test on Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            set -euo pipefail
            apk="exports/rare-v${RELEASE_TAG#rare-final-v}-release.apk"
            adb install "$apk"
            adb shell am start -W -n com.rare.ai.intelligence/.MainActivity
            sleep 5
            adb shell pidof com.rare.ai.intelligence

      - name: Clean-install and smoke test on latest stable API 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          script: |
            set -euo pipefail
            apk="exports/rare-v${RELEASE_TAG#rare-final-v}-release.apk"
            adb install "$apk"
            adb shell am start -W -n com.rare.ai.intelligence/.MainActivity
            sleep 5
            adb shell pidof com.rare.ai.intelligence

      - name: Create, verify, and publish the final GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release-gate.outputs.release_sha }}
          VERSION_NAME: ${{ steps.release-gate.outputs.version_name }}
        run: |
          set -euo pipefail
          apk="exports/rare-v${VERSION_NAME}-release.apk"
          checksum_file="$RUNNER_TEMP/rare-v${VERSION_NAME}-release.apk.sha256"
          sha256sum "$apk" | sed "s#  .*#  rare-v${VERSION_NAME}-release.apk#" > "$checksum_file"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          RARE $VERSION_NAME final Android release

          - Production source: $RELEASE_SHA
          - Package: com.rare.ai.intelligence
          - Backend: https://rareproject.vercel.app
          - Signing certificate SHA-256: 37be10e99449fbc5f90331965905e8d2ccd31a446301eafa20620f11badee1df
          - SHA-256 checksum: see the attached .sha256 file

          This release uses a replacement signing identity. Existing installs signed by earlier RARE releases cannot update in place. Before uninstalling the old app, sign in and confirm cloud sync or export any data that exists only on that device. Uninstall the old app, then install this APK.
          EOF
          gh release create "$RELEASE_TAG" "$apk" "$checksum_file" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "RARE $VERSION_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          mkdir -p "$RUNNER_TEMP/release-download-check"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "rare-v${VERSION_NAME}-release.apk" --pattern "rare-v${VERSION_NAME}-release.apk.sha256" --dir "$RUNNER_TEMP/release-download-check"
          (cd "$RUNNER_TEMP/release-download-check" && sha256sum --check "rare-v${VERSION_NAME}-release.apk.sha256")
          release_id="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" -X PATCH -F draft=false -F make_latest=true --jq '{draft,html_url}'
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,url,assets --jq '{isDraft,url,assets:[.assets[].name]}'

      - name: Retain verified APK as a workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rare-final-apk-${{ steps.release-gate.outputs.version_name }}
          path: exports/rare-v${{ steps.release-gate.outputs.version_name }}-release.apk
          if-no-files-found: error
          retention-days: 14
