name: Build RARE APK (on demand)

# Builds the RARE Android APK from the checked-out source using the repository's
# own scripts/build_apk.sh, signs it with the configured release identity, and
# verifies the result. Nothing here invents a new pipeline.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName for the APK'
        required: false
        default: '1.1.2'
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build, sign and verify the APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version_name: ${{ steps.vars.outputs.version_name }}
      version_code: ${{ steps.vars.outputs.version_code }}

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Resolve version identity
        id: vars
        run: |
          set -euo pipefail
          VN="${{ inputs.version_name || '1.1.2' }}"
          [[ "$VN" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "::error::version_name must be numeric semver"; exit 1; }
          VC=$(( 10#$(date -u +%y%m%d) * 1000 + GITHUB_RUN_NUMBER ))
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "Building $VN (versionCode $VC)"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform 34 and build-tools 34.0.0
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "$SDK/build-tools/34.0.0" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_COMPILE_SDK=34" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS=$SDK/build-tools/34.0.0" >> "$GITHUB_ENV"
          "$SDK/build-tools/34.0.0/aapt2" version
          "$SDK/build-tools/34.0.0/apksigner" --version

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore the release signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing signing secret: $name"; exit 1; }
          done
          umask 077
          mkdir -p "$RUNNER_TEMP/rare-keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rare-keystore/release.keystore"
          export STORE_PASS="$KEYSTORE_PASSWORD"
          keytool -list -v -keystore "$RUNNER_TEMP/rare-keystore/release.keystore" \
            -alias "$KEY_ALIAS" -storepass:env STORE_PASS | tee "$RUNNER_TEMP/keystore-info.txt"
          echo "Keystore restored and readable."

      - name: Build the APK with the repository script
        env:
          RARE_APP_VERSION_NAME: ${{ steps.vars.outputs.version_name }}
          RARE_APP_VERSION_CODE: ${{ steps.vars.outputs.version_code }}
          RARE_BACKEND_URL: https://rareproject.vercel.app
          RARE_ANDROID_KEYSTORE: ${{ runner.temp }}/rare-keystore/release.keystore
          RARE_ANDROID_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RARE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RARE_ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bash scripts/build_apk.sh 2>&1 | tee "$RUNNER_TEMP/build.log"
          apk="exports/rare-v${{ steps.vars.outputs.version_name }}-release.apk"
          test -s "$apk"
          echo "APK built: $apk"

      - name: Verify signature, manifest and packaged backend URL
        run: |
          set -euo pipefail
          apk="exports/rare-v${{ steps.vars.outputs.version_name }}-release.apk"
          {
            echo "### APK verification"
            echo '```'
            echo "--- apksigner verify --verbose --print-certs ---"
            apksigner verify --verbose --print-certs "$apk"
            echo
            echo "--- aapt2 dump badging ---"
            aapt2 dump badging "$apk"
            echo
            echo "--- aapt2 dump xmltree (manifest) ---"
            aapt2 dump xmltree --file AndroidManifest.xml "$apk"
            echo
            echo "--- size ---"
            stat --format='%s bytes' "$apk"
            echo "--- sha256 ---"
            sha256sum "$apk"
            echo '```'
          } | tee "$RUNNER_TEMP/verify.txt"
          {
            echo "## RARE APK build report"
            echo
            echo "- versionName: ${{ steps.vars.outputs.version_name }}"
            echo "- versionCode: ${{ steps.vars.outputs.version_code }}"
            echo "- backend: https://rareproject.vercel.app"
            echo
            cat "$RUNNER_TEMP/verify.txt"
            echo
            echo "### Keystore"
            echo '```'
            cat "$RUNNER_TEMP/keystore-info.txt"
            echo '```'
          } > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the signed APK
        uses: actions/upload-artifact@v4
        with:
          name: rare-apk
          path: exports/rare-v${{ steps.vars.outputs.version_name }}-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload the build report
        uses: actions/upload-artifact@v4
        with:
          name: rare-apk-report
          path: |
            ${{ runner.temp }}/report.md
            ${{ runner.temp }}/build.log
          if-no-files-found: error
          retention-days: 7

      # Publishing is what makes the APK reachable from the app's own download
      # endpoint. Before this step existed the workflow built and verified the
      # APK but published nothing, so /api/download/apk always answered 404.
      # The tag family is `vX.Y.Z-android`, which is what PublishedRelease.ts
      # resolves, and the asset name is `rare-vX.Y.Z-release.apk`.
      - name: Publish the signed APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.vars.outputs.version_name }}
        run: |
          set -euo pipefail
          apk="exports/rare-v${VERSION_NAME}-release.apk"
          test -s "$apk"
          tag="v${VERSION_NAME}-android"
          checksum_file="$RUNNER_TEMP/rare-v${VERSION_NAME}-release.apk.sha256"
          sha256sum "$apk" | sed "s#  .*#  rare-v${VERSION_NAME}-release.apk#" > "$checksum_file"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          RARE ${VERSION_NAME} Android release

          - Built from commit ${GITHUB_SHA}
          - Signed with the permanent RARE release key
          - SHA-256: see the attached .sha256 file
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; uploading/replacing assets."
            gh release upload "$tag" "$apk" "$checksum_file" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$apk" "$checksum_file" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "RARE Android ${VERSION_NAME}" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,assets --jq '{tagName,isDraft,assets:[.assets[].name]}'

  emulator:
    name: Install and launch on an Android emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Check out the source (for the smoke-test script)
        uses: actions/checkout@v4

      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          name: rare-apk
          path: apk

      - name: Install and launch on API 33
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: false
          script: bash scripts/emulator_smoke.sh

      - name: Upload the launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rare-apk-launch-screenshot
          path: ${{ runner.temp }}/launch.png
          if-no-files-found: warn
          retention-days: 7
